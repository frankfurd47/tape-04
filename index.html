<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tape_01</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000000;
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      cursor: none;
    }

    video {
      max-width: 90vw;
      max-height: 90vh;
      outline: none;
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body>

  <!-- REPLACE 'YOUR-EXACT-FILENAME.mp4' WITH YOUR VIDEO'S ACTUAL NAME -->
  <video id="vhsVideo" src="97d15b22-dcd9-4a7c-9424-c776805da5c5.mp4" autoplay muted playsinline></video>

  <script>
    const video = document.getElementById('vhsVideo');

    // Clicking anywhere on the screen unmutes the audio
    document.body.addEventListener('click', () => {
      if (video.muted) {
        video.muted = false;
      }
    });
  </script>

</body>
</html>
