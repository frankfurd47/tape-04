<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tape_01</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #000000;
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      cursor: none;
    }
    video {
      max-width: 90vw;
      max-height: 90vh;
      outline: none;
    }
    #overlay {
      position: fixed;
      inset: 0;
      background: #000000;
      color: #33ff33;
      font-family: monospace;
      font-size: 1.2rem;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 10;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>

  <div id="overlay">[ CLICK TO PLAY TAPE ]</div>

  <video id="vhsVideo" src="tape.mp4" preload="auto" playsinline></video>

  <script>
    const video = document.getElementById('vhsVideo');
    const overlay = document.getElementById('overlay');

    overlay.addEventListener('click', () => {
      video.play().then(() => {
        overlay.style.display = 'none';
      }).catch((err) => {
        overlay.style.color = '#ff3333';
        overlay.textContent = 'ERROR: ' + err.message;
      });
    });

    video.addEventListener('error', () => {
      overlay.style.display = 'flex';
      overlay.style.color = '#ff3333';
      overlay.textContent = 'TAPE NOT FOUND OR UNSUPPORTED FORMAT (CHECK FILENAME: tape.mp4)';
    });

    video.addEventListener('ended', () => {
      window.close();
      document.body.innerHTML = '';
      window.location.replace('about:blank');
    });
  </script>

</body>
</html>
