<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tape_01</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000000;
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      cursor: none;
    }

    video {
      max-width: 90vw;
      max-height: 90vh;
      outline: none;
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.05);
    }

    #soundPrompt {
      position: fixed;
      bottom: 24px;
      color: #666666;
      font-family: monospace;
      font-size: 0.85rem;
      letter-spacing: 2px;
      display: none;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- REPLACE 'YOUR-EXACT-FILENAME.mp4' WITH YOUR VIDEO'S ACTUAL NAME -->
  <video id="vhsVideo" src="YOUR-EXACT-FILENAME.mp4" playsinline></video>
  <div id="soundPrompt">[ CLICK ANYWHERE FOR AUDIO ]</div>

  <script>
    const video = document.getElementById('vhsVideo');
    const prompt = document.getElementById('soundPrompt');

    function unmuteVideo() {
      video.muted = false;
      video.volume = 1.0;
      video.play();
      prompt.style.display = 'none';
    }

    // 1. Try playing WITH sound right away
    video.muted = false;
    video.play().catch(() => {
      // 2. If the browser blocks unmuted autoplay, start muted and show subtle prompt
      video.muted = true;
      video.play();
      prompt.style.display = 'block';
    });

    // Unmute on any click or key press
    document.addEventListener('click', unmuteVideo, { once: true });
    document.addEventListener('keydown', unmuteVideo, { once: true });
  </script>

</body>
</html>
