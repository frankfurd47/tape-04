<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tape_04</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000000;
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      cursor: none;
    }

    video {
      max-width: 90vw;
      max-height: 90vh;
      outline: none;
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.05);
    }

    #soundPrompt {
      position: fixed;
      bottom: 24px;
      color: #666666;
      font-family: monospace;
      font-size: 0.85rem;
      letter-spacing: 2px;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <video id="vhsVideo" src="97d15b22-dcd9-4a7c-9424-c776805da5c5.mp4" autoplay muted loop playsinline></video>
  <div id="soundPrompt">[ CLICK ANYWHERE FOR AUDIO ]</div>

  <script>
    const video = document.getElementById('vhsVideo');
    const prompt = document.getElementById('soundPrompt');

    function unmuteVideo() {
      video.muted = false;
      video.volume = 1.0;
      video.play();
      prompt.style.display = 'none';
    }

    document.addEventListener('click', unmuteVideo, { once: true });
    document.addEventListener('keydown', unmuteVideo, { once: true });
  </script>

</body>
</html>
